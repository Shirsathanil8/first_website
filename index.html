<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Be My Valentine 💖</title>

<style>
    body {
        font-family: Arial, sans-serif;
        background: linear-gradient(to right, #ff758c, #ff7eb3);
        height: 100vh;
        margin: 0;
        overflow: hidden;
    }

    .box {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background: white;
        padding: 30px;
        border-radius: 18px;
        box-shadow: 0 10px 25px rgba(0,0,0,0.25);
        text-align: center;
        width: 360px;
        z-index: 2;
    }

    h1 {
        color: #ff3366;
    }

    .teddy {
        width: 220px;
        margin-bottom: 20px;
    }

    button {
        font-size: 18px;
        padding: 10px 26px;
        border: none;
        border-radius: 10px;
        cursor: pointer;
    }

    #yes {
        background-color: #ff3366;
        color: white;
    }

    #no {
        background-color: #999;
        color: white;
        position: absolute;
        z-index: 5;
    }

    /* Shake animation */
    @keyframes shake {
        0% { transform: translateX(0); }
        25% { transform: translateX(-6px); }
        50% { transform: translateX(6px); }
        75% { transform: translateX(-6px); }
        100% { transform: translateX(0); }
    }

    .shake {
        animation: shake 0.3s;
    }

    /* Floating hearts */
    .heart {
        position: absolute;
        color: rgba(255,255,255,0.8);
        font-size: 20px;
        animation: float 5s linear infinite;
    }

    @keyframes float {
        0% {
            transform: translateY(100vh) scale(1);
            opacity: 1;
        }
        100% {
            transform: translateY(-10vh) scale(1.5);
            opacity: 0;
        }
    }
</style>
</head>

<body>

<div class="box">
    <img src="teddy.svg" class="teddy" id="teddy">
    <h1>Will you be my Valentine? 💘</h1>
    <button id="yes" onclick="yesClicked()">Yes 😍</button>
</div>

<button id="no">No 😅</button>

<script>
    const noBtn = document.getElementById("no");
    const teddy = document.getElementById("teddy");

    let clickCount = 0;
    let shakeTime = 300;

    const noTexts = [
        "No 😅",
        "Are you sure? 😏",
        "Really?? 😳",
        "Think again 😈",
        "Last chance 💔",
        "You can’t escape 😜"
    ];

    function overlapsTeddy(x, y, w, h) {
        const t = teddy.getBoundingClientRect();
        return !(
            x + w < t.left ||
            x > t.right ||
            y + h < t.top ||
            y > t.bottom
        );
    }

    noBtn.style.left = "60%";
    noBtn.style.top = "65%";

    noBtn.addEventListener("click", () => {
        clickCount++;

        // Change text
        noBtn.textContent = noTexts[clickCount % noTexts.length];

        // Faster shake
        shakeTime = Math.max(120, shakeTime - 30);
        noBtn.style.animationDuration = shakeTime + "ms";

        noBtn.classList.add("shake");

        setTimeout(() => {
            noBtn.classList.remove("shake");

            const btnRect = noBtn.getBoundingClientRect();
            const maxX = window.innerWidth - btnRect.width;
            const maxY = window.innerHeight - btnRect.height;

            let x, y, safe = false;

            while (!safe) {
                x = Math.random() * maxX;
                y = Math.random() * maxY;
                safe = !overlapsTeddy(x, y, btnRect.width, btnRect.height);
            }

            noBtn.style.left = x + "px";
            noBtn.style.top = y + "px";
        }, shakeTime);
    });

    function yesClicked() {
        document.body.innerHTML = `
            <div style="text-align:center; color:white; margin-top:25vh;">
                <h1>Yay! 💖 I knew it 😍</h1>
                <img src="teddy.svg" style="width:260px; margin-top:20px;">
            </div>
        `;
    }

    /* Floating hearts generator */
    setInterval(() => {
        const heart = document.createElement("div");
        heart.className = "heart";
        heart.textContent = "❤";
        heart.style.left = Math.random() * 100 + "vw";
        heart.style.fontSize = (16 + Math.random() * 20) + "px";
        document.body.appendChild(heart);

        setTimeout(() => heart.remove(), 5000);
    }, 400);
</script>

</body>
</html>
