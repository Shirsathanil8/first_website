<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Be My Valentine 💖</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: linear-gradient(to right, #ff758c, #ff7eb3);
    height: 100vh;
    margin: 0;
    overflow: hidden;
}

.box {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: white;
    padding: 30px;
    border-radius: 18px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.25);
    text-align: center;
    width: 360px;
    z-index: 2;
}

h1 {
    color: #ff3366;
}

.dabu {
    width: 220px;
    margin-bottom: 10px;
}

/* 🔥 QUESTION STYLE UPDATED */
#question {
    font-size: 22px;       /* Bigger font */
    font-weight: bold;     /* Bold */
    color: #333;
    margin-bottom: 18px;
}

button {
    font-size: 18px;
    padding: 10px 26px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
}

#yes {
    background-color: #ff3366;
    color: white;
}

#no {
    background-color: #999;
    color: white;
    position: absolute;
    z-index: 5;
}

@keyframes shake {
    0% { transform: translateX(0); }
    25% { transform: translateX(-6px); }
    50% { transform: translateX(6px); }
    75% { transform: translateX(-6px); }
    100% { transform: translateX(0); }
}

.shake {
    animation: shake 0.3s;
}

.heart {
    position: absolute;
    color: rgba(255,255,255,0.8);
    font-size: 22px;
    animation: float 5s linear infinite;
}

@keyframes float {
    0% { transform: translateY(100vh); opacity: 1; }
    100% { transform: translateY(-10vh); opacity: 0; }
}
</style>
</head>

<body>

<div class="box">
    <img src="dabu1.gif" class="dabu" id="dabu">
    <h1>Will you be my Valentine? 💘</h1>
    <div id="question">Please think again 🥺</div>
    <button id="yes" onclick="yesClicked()">Yes 😍</button>
</div>

<button id="no">No 😅</button>

<script>
const noBtn = document.getElementById("no");
const dabu = document.getElementById("dabu");
const question = document.getElementById("question");

let clickCount = 0;

const questions = [
 { text: "Please think again 🥺", img: "dabu1.gif" },
 { text: "Ek aur baar soch lo 😢", img: "dabu2.gif" },
 { text: "Kitna code likhwaogi 😭", img: "dabu3.gif" },
 { text: "Ab toh haan bol do ❤️", img: "dabu4.gif" },
 { text: "Itna bhi kya bhaav khaana? 🥹", img: "dabu5.gif" },
 { text: "Dabu ne itni mehnat ki hai yaar 😭💻", img: "dabu6.gif" },
 { text: "Aakhri baar pooch raha hoon… please? ❤️🐶", img: "dabu7.gif" }
];

noBtn.style.left = "60%";
noBtn.style.top = "65%";

noBtn.addEventListener("click", () => {
    clickCount++;

    const q = questions[clickCount % questions.length];
    question.textContent = q.text;
    dabu.src = q.img;

    noBtn.classList.add("shake");

    setTimeout(() => {
        noBtn.classList.remove("shake");

        const maxX = window.innerWidth - noBtn.offsetWidth;
        const maxY = window.innerHeight - noBtn.offsetHeight;

        noBtn.style.left = Math.random() * maxX + "px";
        noBtn.style.top = Math.random() * maxY + "px";
    }, 300);
});

/* 💖 YES CLICK → dabu8.gif */
function yesClicked() {
    document.body.innerHTML = `
        <div style="text-align:center; color:white; margin-top:25vh;">
            <h1>Yay! 💖 I knew it 😍</h1>
            <img src="dabu8.gif" style="width:280px;">
        </div>
    `;
}

setInterval(() => {
    const heart = document.createElement("div");
    heart.className = "heart";
    heart.textContent = "❤";
    heart.style.left = Math.random() * 100 + "vw";
    document.body.appendChild(heart);
    setTimeout(() => heart.remove(), 5000);
}, 400);
</script>

</body>
</html>
